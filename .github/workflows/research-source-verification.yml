name: Research source verification
on:
  push:
    branches: [research/spine-and-family-proof-2dbac64]
    paths: ['.github/workflows/research-source-verification.yml', 'src/**', 'tests/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Supply native-build system dependency
        run: sudo apt-get update -qq && sudo apt-get install -y libboost-dev
      - name: Archive binary dependencies for offline reproduction
        shell: bash
        run: |
          mkdir -p /tmp/kg-wheels
          for package in fastrdp==0.3.2 pybind11==3.1.0 scikit-build-core==0.12.2 igraph==1.0.0 texttable pyvista==0.48.4 vtk==9.6.2 scooby topoly==1.1.0; do
            python -m pip download --only-binary=:all: --no-deps --dest /tmp/kg-wheels "$package" || echo "$package unavailable as a wheel" >> /tmp/kg-wheels/unavailable.txt
          done
          sha256sum /tmp/kg-wheels/*.whl > /tmp/kg-wheels/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: knottedgraph-offline-build-wheels
          path: /tmp/kg-wheels
          retention-days: 7
      - name: Install pinned environment and run repository checks
        shell: bash
        run: |
          python -m pip install uv==0.12.16
          uv sync --all-extras --group dev --group docs --frozen
          uv run --no-sync pytest -q --junitxml=/tmp/kg-pytest.xml
          uv run --no-sync python dev/check_repository_consistency.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: knottedgraph-research-test-results
          path: /tmp/kg-pytest.xml
          if-no-files-found: warn
          retention-days: 7
