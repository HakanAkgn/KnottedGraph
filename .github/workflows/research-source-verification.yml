name: Research source verification
on:
  push:
    branches: [research/spine-and-family-proof-2dbac64]
    paths: ['.github/workflows/research-source-verification.yml', 'src/**', 'tests/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Archive exact tracked source for reproducibility review
        shell: bash
        run: |
          mkdir -p /tmp/kg-review
          git rev-parse HEAD > /tmp/kg-review/commit.txt
          git archive --format=tar HEAD | gzip -1 > /tmp/kg-review/source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: knottedgraph-research-source
          path: /tmp/kg-review
          retention-days: 7
      - name: Install pinned environment and run repository checks
        shell: bash
        run: |
          python -m pip install uv
          uv sync --all-extras --group dev --group docs --frozen
          uv run pytest -q --junitxml=/tmp/kg-pytest.xml
          uv run python dev/check_repository_consistency.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: knottedgraph-research-test-results
          path: /tmp/kg-pytest.xml
          if-no-files-found: warn
          retention-days: 7
