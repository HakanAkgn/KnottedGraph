name: Temporary performance branch validation

on:
  push:
    branches:
      - perf/incremental-yamada-frontier-order

permissions:
  contents: read

concurrency:
  group: temporary-performance-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install full validation environment
        run: uv sync --group dev --group docs --group benchmark --all-extras

      - name: Require all native optimization backends
        run: |
          uv run --no-sync python - <<'PY'
          from knotted_graph.extraction._native import native_skeleton_available, native_skeleton_import_error
          from knotted_graph.invariants.yamada.native import native_available, native_import_error
          from knotted_graph.invariants.yamada.factorized_frontier import native_factorized_available, factorized_import_error
          print("skeleton native:", native_skeleton_available(), native_skeleton_import_error())
          print("resolved Yamada native:", native_available(), native_import_error())
          print("factorized Yamada native:", native_factorized_available(), factorized_import_error())
          assert native_skeleton_available(), native_skeleton_import_error()
          assert native_available(), native_import_error()
          assert native_factorized_available(), factorized_import_error()
          PY

      - name: Diagnose canonical triangular-prism reconstruction
        run: |
          uv run --no-sync python - <<'PY'
          import networkx as nx
          import numpy as np

          from dev.run_skeletonization_45_validation import ORIGINAL_CASES, deform, voxelize
          from knotted_graph.extraction import skeletonize_volume
          from knotted_graph.extraction._native import (
              _compact_graph,
              _compact_summary,
              _select_hops,
              _skeleton_native,
              native_persistent_extract,
          )
          from knotted_graph.extraction._optimized import _sparse_adjacency_python
          from knotted_graph.extraction._topology_optimized import (
              _diagnostic_summary,
              _prepared_components,
              _trace_prepared,
              persistent_extract,
          )

          case = next(item for item in ORIGINAL_CASES if item.name == "triangular_prism")
          target = deform(case.graph, "rotate")
          skeleton = skeletonize_volume(voxelize(target, 1))
          coords, adjacency = _sparse_adjacency_python(skeleton)
          prepared = _prepared_components(coords, adjacency)
          native_candidates = list(_skeleton_native.plan_candidates(skeleton, 4))

          print("skeleton voxels", int(np.count_nonzero(skeleton)))
          for hops, native_candidate in enumerate(native_candidates):
              py_graph = _trace_prepared(prepared, hops)
              py_summary = _diagnostic_summary(
                  py_graph,
                  max_degree=3,
                  anomaly_ratio=0.15,
              )
              native_graph = _compact_graph(native_candidate)
              native_summary = _compact_summary(
                  native_candidate,
                  max_degree=3,
                  anomaly_ratio=0.15,
              )
              print(
                  "h", hops,
                  "python", py_graph.number_of_nodes(), py_graph.number_of_edges(),
                  sorted(dict(py_graph.degree()).values()),
                  "clean", py_summary[1], "safe", py_summary[3],
              )
              print(
                  "h", hops,
                  "native", native_graph.number_of_nodes(), native_graph.number_of_edges(),
                  sorted(dict(native_graph.degree()).values()),
                  "clean", native_summary[1], "safe", native_summary[3],
                  "iso", nx.is_isomorphic(py_graph, native_graph),
              )
              print("fingerprints", py_summary[2], native_summary[2])

          selected_native_hops = _select_hops(
              native_candidates,
              max_degree=3,
              anomaly_ratio=0.15,
          )
          py_selected = persistent_extract(
              coords,
              adjacency,
              max_degree=3,
              max_hops=4,
              anomaly_ratio=0.15,
          )
          native_selected = native_persistent_extract(
              skeleton,
              max_degree=3,
              max_hops=4,
              anomaly_ratio=0.15,
          )
          print("native selected hops", selected_native_hops)
          print(
              "selected python",
              py_selected.number_of_nodes(),
              py_selected.number_of_edges(),
              sorted(dict(py_selected.degree()).values()),
          )
          print(
              "selected native",
              native_selected.number_of_nodes(),
              native_selected.number_of_edges(),
              sorted(dict(native_selected.degree()).values()),
              "iso", nx.is_isomorphic(py_selected, native_selected),
          )
          PY

      - name: Run exact optimization regression suites
        run: >
          uv run --no-sync pytest -q
          tests/core/test_topology_aware_skeleton.py
          tests/core/test_topology_persistence_selection.py
          tests/extraction
          tests/projection
          tests/invariants/yamada
          tests/applications/test_phase_maps.py
          tests/applications/test_material_surface_optimization.py
          tests/applications/test_nodal_regressions.py

      - name: Run complete pytest suite
        run: uv run --no-sync pytest -q

      - name: Run 45-case skeleton reconstruction validation
        run: uv run --no-sync python dev/run_skeletonization_45_validation.py

      - name: Run independent published Yamada sanity checks
        run: uv run --no-sync python dev/run_yamada_sanity_checks.py

      - name: Run stage performance audit
        run: uv run --no-sync python dev/final_performance_audit.py

      - name: Execute correctness benchmark notebooks
        env:
          PYTHONNOUSERSITE: "1"
          MPLBACKEND: Agg
          PYVISTA_OFF_SCREEN: "true"
          PLOTLY_RENDERER: json
        run: |
          uv run --no-sync python dev/execute_notebook.py User_guide/benchmarks/01_yamada_sanity_checks.ipynb --timeout 7200
          uv run --no-sync python dev/execute_notebook.py User_guide/benchmarks/02_application_regression_checks.ipynb --timeout 7200
          uv run --no-sync python dev/execute_notebook.py User_guide/benchmarks/03_knottedgraph_vs_topoly_scaling.ipynb --timeout 7200
          uv run --no-sync python dev/execute_notebook.py User_guide/benchmarks/04_thick_handlebody_validation.ipynb --timeout 7200
