name: Temporary performance branch validation

on:
  push:
    branches:
      - perf/incremental-yamada-frontier-order

permissions:
  contents: read

concurrency:
  group: temporary-performance-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install full validation environment
        run: uv sync --group dev --group docs --group benchmark --all-extras

      - name: Require all native optimization backends
        run: |
          uv run --no-sync python - <<'PY'
          from knotted_graph.extraction._native import native_skeleton_available, native_skeleton_import_error
          from knotted_graph.invariants.yamada.native import native_available, native_import_error
          from knotted_graph.invariants.yamada.factorized_frontier import native_factorized_available, factorized_import_error
          print("skeleton native:", native_skeleton_available(), native_skeleton_import_error())
          print("resolved Yamada native:", native_available(), native_import_error())
          print("factorized Yamada native:", native_factorized_available(), factorized_import_error())
          assert native_skeleton_available(), native_skeleton_import_error()
          assert native_available(), native_import_error()
          assert native_factorized_available(), factorized_import_error()
          PY

      - name: Run exact optimization regression suites
        run: >
          uv run --no-sync pytest -q
          tests/core/test_topology_aware_skeleton.py
          tests/core/test_topology_persistence_selection.py
          tests/extraction
          tests/projection
          tests/invariants/yamada
          tests/applications/test_phase_maps.py
          tests/applications/test_material_surface_optimization.py
          tests/applications/test_nodal_regressions.py

      - name: Run complete pytest suite
        run: uv run --no-sync pytest -q

      - name: Run 45-case skeleton no-regression comparison
        shell: bash
        run: |
          git fetch --no-tags origin 43620e20800dfa144987c7bb2cb9997f184631cd
          git worktree add --detach /tmp/kg-requested-base 43620e20800dfa144987c7bb2cb9997f184631cd

          set +e
          uv run --no-sync python dev/run_skeletonization_45_validation.py > /tmp/head45.log 2>&1
          HEAD_RC=$?
          (
            cd /tmp/kg-requested-base
            PYTHONPATH=/tmp/kg-requested-base/src "$GITHUB_WORKSPACE/.venv/bin/python"               dev/run_skeletonization_45_validation.py
          ) > /tmp/base45.log 2>&1
          BASE_RC=$?
          set -e

          cat /tmp/head45.log
          echo "HEAD_45_EXIT=$HEAD_RC"
          echo "BASE_45_EXIT=$BASE_RC"

          uv run --no-sync python - <<'PY'
          import ast
          from pathlib import Path

          def outcomes(path):
              result = []
              for line in Path(path).read_text().splitlines():
                  stripped = line.strip()
                  if not stripped.startswith("{'index':"):
                      continue
                  row = ast.literal_eval(stripped)
                  result.append(
                      (
                          int(row["index"]),
                          str(row["case"]),
                          str(row["transform"]),
                          int(row["radius"]),
                          bool(row["correct"]),
                      )
                  )
              if len(result) != 45:
                  raise AssertionError(f"{path} yielded {len(result)} case rows, expected 45")
              return result

          head = outcomes("/tmp/head45.log")
          base = outcomes("/tmp/base45.log")

          regressions = []
          improvements = []
          for head_row, base_row in zip(head, base, strict=True):
              if head_row[:4] != base_row[:4]:
                  raise AssertionError(
                      f"45-case row identity changed: head={head_row}, base={base_row}"
                  )
              if base_row[-1] and not head_row[-1]:
                  regressions.append((head_row, base_row))
              if head_row[-1] and not base_row[-1]:
                  improvements.append((head_row, base_row))

          if regressions:
              raise AssertionError(
                  f"optimized skeleton reconstruction regressed requested-base cases: {regressions}"
              )

          passed = sum(row[-1] for row in head)
          print(
              f"45-case head correctness: {passed}/45; "
              f"requested-base improvements: {len(improvements)}"
          )
          if improvements:
              print(f"Improved cases: {improvements}")
          if passed != 45:
              failed = [row for row in head if not row[-1]]
              raise AssertionError(
                  f"optimized skeleton reconstruction is not 45/45: {failed}"
              )
          PY

      - name: Run independent published Yamada sanity checks
        run: uv run --no-sync python dev/run_yamada_sanity_checks.py

      - name: Run stage performance audit
        run: uv run --no-sync python dev/final_performance_audit.py

      - name: Execute correctness benchmark notebooks
        env:
          PYTHONNOUSERSITE: "1"
          MPLBACKEND: Agg
          PYVISTA_OFF_SCREEN: "true"
          PLOTLY_RENDERER: json
        run: |
          uv run --no-sync python dev/execute_notebook.py User_guide/benchmarks/01_yamada_sanity_checks.ipynb --timeout 7200
          uv run --no-sync python dev/execute_notebook.py User_guide/benchmarks/02_application_regression_checks.ipynb --timeout 7200
          uv run --no-sync python dev/execute_notebook.py User_guide/benchmarks/03_knottedgraph_vs_topoly_scaling.ipynb --timeout 7200
          uv run --no-sync python dev/execute_notebook.py User_guide/benchmarks/04_thick_handlebody_validation.ipynb --timeout 7200
