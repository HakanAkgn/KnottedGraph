name: Systematic fix validation

on:
  push:
    branches:
      - validation/systematic-audit-fixes-20260921

permissions:
  contents: read

jobs:
  focused:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PYTHONNOUSERSITE: "1"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MPLBACKEND: Agg
      PYVISTA_OFF_SCREEN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install full validation environment
        run: uv sync --group dev --all-extras
      - name: Run systematic regression tests
        run: uv run --no-sync pytest -q tests/test_systematic_audit_regressions.py
      - name: Run full Python test suite
        run: uv run --no-sync pytest -q
