name: Scoped solid-spine verification
on:
  push:
    branches: [research/solid-spine-maps-41dc87c]
    paths:
      - '.github/workflows/solid-spine-verification.yml'
      - 'src/knotted_graph/extraction/cubical_spine.py'
      - 'tests/extraction/test_cubical_spine.py'
      - 'dev/run_solid_spine_audit.py'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install pinned package with native dependencies
        shell: bash
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libboost-dev
          python -m pip install uv==0.12.16
          uv sync --all-extras --group dev --group docs --frozen
      - name: Check complete repository and new collapse witnesses
        shell: bash
        run: |
          uv run --no-sync pytest -q --junitxml=/tmp/kg-spine-tests.xml
          uv run --no-sync python dev/check_repository_consistency.py
          uv run --no-sync ruff check src/knotted_graph/extraction/cubical_spine.py tests/extraction/test_cubical_spine.py dev/run_solid_spine_audit.py
      - name: Exercise original fields without modifying any archived map
        shell: bash
        run: |
          uv run --no-sync python dev/run_solid_spine_audit.py --out /tmp/kg-spine-results --dimension 64 --seconds 420 --case-seconds 65
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: scoped-solid-spine-results
          path: |
            /tmp/kg-spine-tests.xml
            /tmp/kg-spine-results
          retention-days: 30
