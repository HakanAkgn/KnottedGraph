name: All unresolved TPMS event checks
on:
  push:
    branches: [research/solid-spine-maps-41dc87c]
    paths: ['.github/workflows/all-tpms-stationary-events.yml']
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install frozen environment and test numerical verifier
        run: |
          sudo apt-get update -qq && sudo apt-get install -y libboost-dev
          python -m pip install uv==0.12.16
          uv sync --all-extras --group dev --group docs --frozen
          uv run --no-sync pytest -q tests/core/test_critical_events.py tests/core/test_tpms_event_membership.py
          uv run --no-sync ruff check dev/verify_all_tpms_events.py
      - name: Require complete original adaptive run
        run: gh run watch 35411858561 --interval 30 --exit-status > /tmp/adaptive-input-status.log 2>&1
      - uses: actions/download-artifact@v4
        with:
          pattern: refined-tpms-shard-*
          run-id: 35411858561
          github-token: ${{ github.token }}
          path: adaptive-input
      - name: Certify actual stationary points and replay every positive result
        run: |
          uv run --no-sync python dev/verify_all_tpms_events.py --root adaptive-input --out tpms-event-results
          git diff --exit-code
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: complete-tpms-event-review
          path: tpms-event-results
          retention-days: 30
